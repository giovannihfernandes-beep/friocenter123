<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Cadastro FRIOCENTER</title>
    <style>
        :root {
            --azul-frio: #00509d;
            --amarelo-frio: #ffc20e;
            --fundo: #f0f4f7;
            --branco: #ffffff;
            --texto: #002d5b;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--fundo); 
            margin: 0; 
            padding: 20px; 
            color: var(--texto);
        }

        .container { 
            max-width: 850px; 
            margin: 0 auto; 
            background: var(--branco); 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0, 74, 153, 0.15);
            border-top: 15px solid var(--azul-frio);
        }

        .header { text-align: center; margin-bottom: 40px; }
        
        .logo-txt {
            color: var(--azul-frio);
            font-size: 38px;
            font-weight: 900;
            margin: 0;
            letter-spacing: -1px;
        }

        h1 { 
            color: var(--azul-frio); 
            font-size: 20px; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            margin-top: 5px;
            font-weight: 400;
        }

        .upload-master { 
            border: 3px dashed #cbd6e2; 
            background-color: #f8fbff; 
            padding: 45px; 
            text-align: center; 
            border-radius: 15px; 
            cursor: pointer; 
            margin-bottom: 35px; 
            transition: 0.3s;
        }
        .upload-master:hover { border-color: var(--azul-frio); }
        .upload-master p { color: var(--azul-frio); font-weight: bold; font-size: 18px; margin: 0; }

        .section { 
            margin-bottom: 30px; 
            padding: 25px; 
            border: 1px solid #e1e8ef; 
            border-radius: 12px; 
        }
        h2 { 
            font-size: 16px; 
            color: var(--azul-frio); 
            text-transform: uppercase;
            border-left: 6px solid var(--amarelo-frio);
            padding-left: 15px;
            margin-bottom: 25px;
        }

        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 8px; font-size: 13px; color: #546e7a; }
        
        input { 
            padding: 14px; 
            border: 1px solid #cfd8dc; 
            border-radius: 8px; 
            font-size: 14px; 
        }
        
        input[readonly] { 
            background-color: #f4f7f9; 
            color: #78909c; 
            cursor: not-allowed; 
        }

        .row { display: flex; gap: 20px; }
        .row .form-group { flex: 1; }

        .status-box { 
            padding: 15px; 
            border-radius: 10px; 
            text-align: center; 
            font-weight: bold; 
            margin-bottom: 30px; 
            display: none; 
        }
        .loading { background-color: #fffde7; color: #f57f17; border: 1px solid #fff59d; }
        .success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .error { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }

        button { 
            background-color: var(--azul-frio); 
            color: white; 
            border: none; 
            padding: 22px; 
            font-size: 20px; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            text-transform: uppercase;
            box-shadow: 0 6px 20px rgba(0, 74, 153, 0.25);
        }
        button:hover { background-color: #003a7a; transform: translateY(-2px); }

        .nf-grid { background: #f8fbff; padding: 15px; border-radius: 10px; margin-top: 10px; border: 1px solid #e1eef7; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <p class="logo-txt">FRIOCENTER</p>
        <h1>Solicitação de Cadastro</h1>
    </div>

    <div class="upload-master" onclick="document.getElementById('arquivos').click()">
        <p>📂 CLIQUE PARA ANEXAR DOCUMENTOS (CNPJ E NFs)</p>
        <input type="file" id="arquivos" multiple accept="image/*,.pdf" style="display: none;" onchange="processarArquivos(this)">
    </div>

    <div id="statusIA" class="status-box"></div>

    <form action="https://formspree.io/f/mojgbdll" method="POST" id="meuFormulario">
        <input type="hidden" name="DOSSIE_FORMATADO" id="dossie_final">

        <div class="section">
            <h2>1. Dados do Representante</h2>
            <div class="row">
                <div class="form-group"><label>Vendedor:</label><input type="text" id="vendedor"></div>
                <div class="form-group"><label>Código:</label><input type="text" id="codigo_vendedor"></div>
            </div>
            <div class="form-group"><label>Prazo Solicitado:</label><input type="text" id="prazo_solicitado"></div>
        </div>

        <div class="section">
            <h2>2. Dados da Empresa e Serasa</h2>
            <div class="row">
                <div class="form-group"><label>CNPJ:</label><input type="text" id="cnpj_numero" readonly></div>
                <div class="form-group"><label>Razão Social:</label><input type="text" id="cnpj_razao" readonly></div>
            </div>
            <div class="form-group"><label>SERASA:</label><input type="text" id="serasa_status" readonly></div>
            <div class="form-group"><label>Endereço Completo:</label><input type="text" id="cnpj_endereco" readonly></div>
        </div>

        <div class="section">
            <h2>3. Referências Comerciais</h2>
            <div id="lista-nfs">
                <div class="row">
                    <input type="text" id="razao1" placeholder="Emitente 1" readonly style="flex:2">
                    <input type="text" id="valor1" placeholder="Valor" readonly style="flex:1">
                    <input type="text" id="prazo1" placeholder="Prazo" readonly style="flex:1">
                </div>
                <br>
                <div class="row">
                    <input type="text" id="razao2" placeholder="Emitente 2" readonly style="flex:2">
                    <input type="text" id="valor2" placeholder="Valor" readonly style="flex:1">
                    <input type="text" id="prazo2" placeholder="Prazo" readonly style="flex:1">
                </div>
                <br>
                <div class="row">
                    <input type="text" id="razao3" placeholder="Emitente 3" readonly style="flex:2">
                    <input type="text" id="valor3" placeholder="Valor" readonly style="flex:1">
                    <input type="text" id="prazo3" placeholder="Prazo" readonly style="flex:1">
                </div>
            </div>
        </div>

        <div class="section">
            <h2>4. Contato</h2>
            <div class="row">
                <div class="form-group"><label>E-mail do Cliente:</label><input type="text" id="email_cliente"></div>
                <div class="form-group"><label>Telefone do Cliente:</label><input type="text" id="tel_cliente"></div>
            </div>
        </div>

        <button type="button" onclick="enviarTudo()">ENVIAR CADASTRO</button>
    </form>
</div>

<script>
    const API_KEY = "AQ.Ab8RN6JHMKp23ZflfZB6AaRmXn8bB4-Pv2XERrXTUgazplWgcA";
    let nfCount = 1;

    async function processarArquivos(input) {
        const files = Array.from(input.files);
        if (files.length === 0) return;
        const status = document.getElementById('statusIA');
        status.style.display = 'block';
        status.className = 'status-box loading';
        nfCount = 1; 

        for (let i = 0; i < files.length; i++) {
            status.innerText = `⏳ Analisando arquivo ${i+1}: ${files[i].name}...`;
            if (i > 0) await new Promise(r => setTimeout(r, 4000));
            try { await analisarComIA(files[i]); } catch (err) {
                status.className = 'status-box error';
                status.innerText = `❌ Erro: ${err.message}`;
                return;
            }
        }
        status.className = 'status-box success';
        status.innerText = "✅ Processamento concluído!";
    }

    async function analisarComIA(file) {
        const base64 = await new Promise((res) => {
            const r = new FileReader();
            r.onload = () => res(r.result.split(",")[1]);
            r.readAsDataURL(file);
        });

        const prompt = `Analise o documento e extraia CNPJ, Razão Social, Endereço, Notas Fiscais ou Serasa. Ignore contato. Retorne LISTA JSON: [{"tipo":"cnpj","cnpj":"...","razao":"...","endereco":"..."}, {"tipo":"nf","emitente":"...","valor":"...","emissao":"AAAA-MM-DD","vencimento":"AAAA-MM-DD"},{"tipo":"serasa","status":"..."}]`;

        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${API_KEY}`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ contents: [{parts: [{text: prompt}, {inlineData: {mimeType: file.type || "image/jpeg", data: base64}}]}] })
        });

        const data = await resp.json();
        let text = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
        let lista = JSON.parse(text);
        if (!Array.isArray(lista)) lista = [lista];

        lista.forEach(doc => {
            if (doc.tipo === 'cnpj') {
                document.getElementById('cnpj_numero').value = doc.cnpj || '';
                document.getElementById('cnpj_razao').value = doc.razao || '';
                document.getElementById('cnpj_endereco').value = doc.endereco || '';
            } else if (doc.tipo === 'serasa') {
                document.getElementById('serasa_status').value = doc.status || '';
            } else if (doc.tipo === 'nf' && nfCount <= 3) {
                document.getElementById('razao' + nfCount).value = doc.emitente || '';
                document.getElementById('valor' + nfCount).value = doc.valor || '';
                if(doc.emissao && doc.vencimento) {
                    const diff = Math.ceil((new Date(doc.vencimento) - new Date(doc.emissao)) / 86400000);
                    document.getElementById('prazo' + nfCount).value = (diff >= 0 ? diff : 0) + " dias";
                }
                nfCount++;
            }
        });
    }

    function enviarTudo() {
        const resumoWhats = `
*SOLICITAÇÃO DE ANÁLISE DE PRAZO*
---------------------------------------
*VENDEDOR:* ${document.getElementById('vendedor').value.toUpperCase()}
*PRAZO SOLICITADO:* ${document.getElementById('prazo_solicitado').value.toUpperCase()}

*DADOS DA EMPRESA:*
---------------------------------------
*RAZÃO SOCIAL:* ${document.getElementById('cnpj_razao').value.toUpperCase()}
*CNPJ:* ${document.getElementById('cnpj_numero').value}
*SERASA:* ${document.getElementById('serasa_status').value.toUpperCase()}

*REFERÊNCIAS COMERCIAIS:*
---------------------------------------
1. ${document.getElementById('razao1').value.toUpperCase()} | R$ ${document.getElementById('valor1').value} | Prazo: ${document.getElementById('prazo1').value}
2. ${document.getElementById('razao2').value.toUpperCase()} | R$ ${document.getElementById('valor2').value} | Prazo: ${document.getElementById('prazo2').value}
3. ${document.getElementById('razao3').value.toUpperCase()} | R$ ${document.getElementById('valor3').value} | Prazo: ${document.getElementById('prazo3').value}

CONTATO:
---------------------------------------
E-MAIL: ${document.getElementById('email_cliente').value.toLowerCase()}
TELEFONE: ${document.getElementById('tel_cliente').value}
        `;

        document.getElementById('dossie_final').value = resumoWhats;
        document.getElementById('meuFormulario').submit();
    }
</script>

</body>
</html>
